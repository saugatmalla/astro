title: "Chimacum Creek"
description: "Chimacum Creek ist ein Fluss im Jefferson County, Washington, USA. Der Hauptstamm (auch als West Chimacum Creek bekannt) befindet sich an der Basis der Quimper-Halbinsel im Nordosten der größeren Olympic-Halbinsel und entspringt einer Reihe von Quellen und Teichen in den bewaldeten Hügeln südlich der Discovery Bay."
primaryCta: "Mehr erfahren"
secondaryCta: "Die Idee erkunden"
featureTitle: "Verlauf"
featureDescription: "Die Topographie des Einzugsgebiets wurde stark vom Vorrücken und Zurückweichen des Kordilleren-Eisschildes während des Letzten Glazialen Maximums geprägt, wodurch große Mengen an glazialem Schmelzwasser und Sedimentmaterial abgelagert wurden."
features:
  - title: "Wasserqualität"
    description: "Die meiste Zeit des Jahres fließt der Hauptstamm aus dem Delanty Lake; im Sommer trocknet dieser Verlauf jedoch aus und bildet sich stattdessen aus Quellen und Sickerwasser.[4][3] Er fließt zunächst nach Süden und dann nach Osten über eine kleine Schlucht durch die gemeindefreie Siedlung Center. Dann fließt er nach Nordosten durch das Center Valley und nimmt nach 3,5 Meilen (5,6 km) den Barnstorm Creek als Nebenfluss auf."
  - title: "Gülle"
    description: "Die größte Sorge um die Wasserqualität im Chimacum-Einzugsgebiet ist die Verunreinigung des Baches durch Viehdung, wodurch die Gefahr besteht, dass sich Krankheitserreger im Wasser ausbreiten."
  - title: "Durchfluss"
    description: "Etwa 20–30 % des durchschnittlichen Durchflusses des Systems werden durch den East Fork beigesteuert, der Rest durch den Hauptstamm (West Chimacum Creek)."

