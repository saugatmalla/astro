eyebrow: "From Wikipedia, the free encyclopedia"
title: "Chimacum Creek"
description: "Chimacum Creek is a stream in Jefferson County, Washington, United States. Located on the base of the Quimper Peninsula in the northeast of the larger Olympic Peninsula, the main stem (also known as West Chimacum Creek) originates from a series of springs and ponds in the forested hills south of Discovery Bay."
primaryCta: "Learn more"
secondaryCta: "Explore the idea"
featureTitle: "Course"
featureDescription: "The topography of the watershed was shaped heavily by the advance and retreat of the Cordilleran ice sheet during the Last Glacial Maximum, which deposited large amounts of glacial outwash and sedimentary material"
features:
  - title: "Water quality"
    description: "For most of the year, the mainstem discharges out of Delanty Lake; however, during the summer this course runs dry, and it instead forms from springs and seeps.[4][3] It flows first south and then east via a small canyon through the unincorporated community of Center. It then flows northeast through the Center Valley, receiving Barnstorm Creek as a tributary 3.5 miles (5.6 km)"
  - title: "Manure"
    description: "The greatest water quality concern in the Chimacum watershed is the contamination of the creek by livestock manure, which risks the spread of pathogens into the water"
  - title: "Flow"
    description: "Roughly 20–30% of the average flow of the system is contributed by the East Fork, with the remainder contributed by the mainstem (West Chimacum Creek)."

