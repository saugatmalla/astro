title: "Chimacum Creek"
description: "Chimacum Creek es un arroyo en el condado de Jefferson, Washington, Estados Unidos. Ubicado en la base de la península de Quimper, en el noreste de la península Olímpica, el brazo principal (también conocido como West Chimacum Creek) se origina a partir de una serie de manantiales y estanques en las colinas boscosas al sur de Discovery Bay."
primaryCta: "Más información"
secondaryCta: "Explorar la idea"
featureTitle: "Curso"
featureDescription: "La topografía de la cuenca fue moldeada en gran medida por el avance y retroceso de la capa de hielo de la Cordillera durante el Último Máximo Glacial, que depositó grandes cantidades de deslavado glacial y material sedimentario."
features:
  - title: "Calidad del agua"
    description: "Durante la mayor parte del año, el brazo principal desemboca del lago Delanty; sin embargo, durante el verano este curso se seca y, en su lugar, se forma a partir de manantiales y filtraciones.[4][3] Fluye primero hacia el sur y luego hacia el este a través de un pequeño cañón por la comunidad no incorporada de Center. Luego fluye hacia el noreste por el valle de Center, recibiendo al Barnstorm Creek como afluente a 3,5 millas (5,6 km)."
  - title: "Estiércol"
    description: "La mayor preocupación por la calidad del agua en la cuenca de Chimacum es la contaminación del arroyo por el estiércol del ganado, lo que conlleva el riesgo de propagación de patógenos en el agua."
  - title: "Caudal"
    description: "Aproximadamente el 20-30 % del caudal medio del sistema es aportado por la bifurcación este (East Fork), y el resto por el brazo principal (West Chimacum Creek)."

